name: Visual insights regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile and run all tests without skips
        run: |
          python -m compileall -q app.py visual_insights_core.py test_visual_insights.py
          python - <<'PY'
          import sys
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('.', pattern='test_*.py'))
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
