[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics"
version = "1.4.0"
description = "Polars-based retail customer behavior analytics pipeline"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "polars>=1.31",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]
optional-dependencies = { dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "mypy>=1.5.0", "ruff>=0.1.0"], docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.0.0"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
retail-analytics = "retail_analytics.core.retail_polars_workflow:main"
retail-patronage = "retail_analytics.patronage.patronage:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true