[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics"
version = "1.4.0"
description = "Polars-based retail customer behavior analytics pipeline"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "polars>=1.31",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "scipy>=1.11.0",
    "networkx>=3.0",
]
optional-dependencies = { dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "mypy>=1.5.0", "ruff>=0.1.0", "import-linter>=2.0"], docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.0.0"], viz = ["networkx>=3.0"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
retail-analytics = "retail_analytics.core.retail_polars_workflow:main"
retail-patronage = "retail_analytics.patronage.patronage:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.importlinter]
root_package = "retail_analytics"

[tool.importlinter.contracts.no-view-imports-from-app]
name = "Views must not import application entry points"
type = "forbidden"
source_modules = ["retail_analytics.dashboard.views"]
forbidden_modules = ["retail_analytics.dashboard.app", "retail_analytics.dashboard.loyalty_app"]

[tool.importlinter.contracts.core-independent-of-dashboard]
name = "Core must not depend on dashboard"
type = "forbidden"
source_modules = ["retail_analytics.core"]
forbidden_modules = ["retail_analytics.dashboard"]